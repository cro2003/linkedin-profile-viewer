name: deploy

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.BASE_URL }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2  # v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 30m   # first build pulls the Playwright base image
          script: |
            set -e
            APP=${{ secrets.APP_DIR }}
            : "${APP:?APP_DIR secret is not set}"
            if [ ! -d "$APP/.git" ]; then
              git clone ${{ secrets.REPO_SSH_URL }} "$APP"
            fi
            cd "$APP"
            git fetch origin
            git reset --hard origin/main

            # APP_ENV holds the application settings; LPG_DOMAIN is appended because
            # compose reads this same file for ${LPG_DOMAIN} substitution
            cat > .env <<'__APP_ENV__'
            ${{ secrets.APP_ENV }}
            __APP_ENV__
            echo "LPG_DOMAIN=${{ secrets.LPG_DOMAIN }}" >> .env
            chmod 600 .env

            docker network create proxy 2>/dev/null || true
            docker compose -f docker-compose.yml -f docker-compose.traefik.yml up -d --build

            # confirm the app is actually serving before calling the deploy good
            for i in $(seq 1 30); do
              if docker compose exec -T api python -c "
            import sys, urllib.request
            try:
                body = urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()
                sys.exit(0 if b'\"status\"' in body else 1)
            except Exception:
                sys.exit(1)
            "; then
                echo "health check passed"
                break
              fi
              if [ "$i" = "30" ]; then
                echo "health check never passed; recent logs:"
                docker compose logs --tail 50 api
                exit 1
              fi
              sleep 3
            done

            # 2GB images accumulate fast on a small VM
            docker image prune -f
