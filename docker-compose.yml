services:
  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - mongo
      - redis
    restart: unless-stopped

  worker:
    # Slim image by default: no browser. Accounts are added by pasting a cookie jar
    # in /admin, which needs no browser at all. For browser-based cookie re-minting
    # and OTP login, add the opt-in overlay:
    #   docker compose -f docker-compose.yml -f docker-compose.browser.yml up -d
    # That pulls a ~2.2GB Playwright image, so check disk first.
    build: .
    command: ["arq", "app.worker.WorkerSettings"]
    env_file: .env
    depends_on:
      - mongo
      - redis
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  mongo_data:
  redis_data:
