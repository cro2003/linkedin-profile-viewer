# Opt-in: gives the worker a browser, enabling cookie re-minting and "sign in"
# account creation with OTP relay. Costs ~2.2GB of disk, so check `df -h` first.
#   docker compose -f docker-compose.yml -f docker-compose.browser.yml up -d --build
# Keep one replica: an OTP login holds a browser open inside a single job.
services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: ["arq", "app.worker.WorkerSettings"]
    environment:
      BROWSER_PROFILE_DIR: /data/browser
    volumes:
      - browser_profiles:/data/browser

volumes:
  browser_profiles:
